version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The module references Umbraco as a range ([17.8.1, 19.0.0)), so it already runs on the
      # next major. A major bump would raise the lower bound and drop the older Umbraco, and
      # the packages can't be bumped one at a time (NU1107). Widen the range by hand instead.
      - dependency-name: "Umbraco.Cms*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories: ["/Tests/Docs", "/Tests/E2E"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
